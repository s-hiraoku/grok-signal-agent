name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check shell syntax
        run: bash -n scripts/*.sh tests/run.sh

      - name: Run regression tests
        run: tests/run.sh
